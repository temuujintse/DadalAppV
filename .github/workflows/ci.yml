name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family_habit
          POSTGRES_PASSWORD: family_habit_ci
          POSTGRES_DB: family_habit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family_habit -d family_habit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # CI-only throwaway values; the e2e helper refuses databases without "_test".
      NODE_ENV: test
      CORS_ORIGINS: '*'
      DATABASE_URL: postgresql://family_habit:family_habit_ci@localhost:5432/family_habit_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijklmnop
      INVITE_TOKEN_SECRET: ci-only-invite-secret-0123456789abcdefghijklmnop
      RATE_LIMIT_DEFAULT: '10000'
      RATE_LIMIT_AUTH: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # .env.test is git-ignored; the job env above provides the same variables.
      - run: touch .env.test && npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runtime -t family-habit-api:ci ./backend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      - run: npx expo install --check

# Render Blueprint — Family Habit API + PostgreSQL.
# Dashboard → New → Blueprint → select this repository → Apply.
# Secrets are generated by Render; nothing secret is stored in this file.
# Plans: "free" to try it out (the web service sleeps when idle and the free database
# expires after a limited period — check Render's current terms); switch to paid plans
# (e.g. starter / basic-256mb) before real users arrive.

databases:
  - name: family-habit-db
    plan: free
    region: singapore
    databaseName: family_habit
    user: family_habit
    postgresMajorVersion: '16'

services:
  - type: web
    name: family-habit-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: family-habit-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: INVITE_TOKEN_SECRET
        generateValue: true
      # The mobile app does not use CORS; list web/admin origins here when you have them.
      - key: CORS_ORIGINS
        value: https://family-habit-api.onrender.com
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: OFFLINE_SYNC_WINDOW_DAYS
        value: '3'
      - key: RATE_LIMIT_DEFAULT
        value: '120'
      - key: RATE_LIMIT_AUTH
        value: '10'
      # Password-reset e-mail (https://resend.com). Set the key in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
